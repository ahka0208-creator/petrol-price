<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⛽ 香港每日油價通</title>
    <style>
        :root {
            /* 柔和莫蘭迪午夜藍配色 */
            --bg-dark: #1E232E;       
            --bg-card: #2A3143;       
            --primary: #82A0D8;       
            --primary-glow: rgba(130, 160, 216, 0.25);
            --text-main: #E2E8F0;     
            --text-muted: #94A3B8;    
            --success: #5D8A66;
            --danger: #D88282;
            --gold: #FBBF24;
            --badge-bg: rgba(251, 191, 36, 0.2);
            --esso-blue: #1E88E5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 4px;
        }
        .header h2 {
            color: var(--primary);
            font-size: 24px;
            margin: 0 0 6px 0;
            letter-spacing: 1px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
        }

        /* 狀態列 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .update-time {
            font-size: 12px;
            color: var(--text-muted);
        }
        .refresh-btn {
            background: rgba(130, 160, 216, 0.15);
            color: var(--primary);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .refresh-btn:active { transform: scale(0.95); }

        /* 車隊卡專屬開關面板 */
        .fleet-card-box {
            background: linear-gradient(135deg, rgba(42, 49, 67, 0.8) 0%, rgba(30, 136, 229, 0.15) 100%);
            border: 1px solid rgba(30, 136, 229, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fleet-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .fleet-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .fleet-desc {
            font-size: 11px;
            color: var(--primary);
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.1);
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--esso-blue); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* 分類 Tabs */
        .tabs {
            display: flex;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #111827;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        /* 油站列表 */
        .price-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 5px solid var(--station-color, var(--primary));
            position: relative;
            animation: slideIn 0.3s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .rank {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-muted);
            width: 30px;
            text-align: center;
            opacity: 0.5;
        }
        .rank.first {
            color: var(--gold);
            opacity: 1;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
        }

        .station-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
            margin-left: 12px;
        }
        .station-name {
            font-weight: bold;
            font-size: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .badge {
            background: var(--badge-bg);
            color: var(--gold);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge.fleet {
            background: rgba(30, 136, 229, 0.2);
            color: var(--primary);
        }

        .price-breakdown {
            font-size: 12px;
            color: var(--text-muted);
        }
        .strike-price {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .discount-amt {
            color: var(--success);
            font-weight: bold;
        }

        .final-price-box {
            text-align: right;
            min-width: 80px;
        }
        .final-price {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        .unit {
            font-size: 11px;
            color: var(--text-muted);
        }

        .disclaimer {
            font-size: 11px;
            color: rgba(148, 163, 184, 0.6);
            line-height: 1.5;
            text-align: justify;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>⛽ 香港每日油價通</h2>
        <p>實時比較各大門市與車隊卡專屬折扣</p>
    </div>

    <!-- 狀態列 -->
    <div class="status-bar">
        <span class="update-time" id="updateTime">最後更新: 載入中...</span>
        <button class="refresh-btn" id="refreshBtn" onclick="fetchData()">🔄 立即同步</button>
    </div>

    <!-- 車隊卡開關 -->
    <div class="fleet-card-box">
        <div class="fleet-info">
            <div class="fleet-title">💳 啟用專屬 Esso 車隊卡</div>
            <div class="fleet-desc">Extra 減 $10 | Supreme+ 減 $11</div>
        </div>
        <label class="switch">
            <input type="checkbox" id="fleetToggle" onchange="renderList(currentTab)" checked>
            <span class="slider"></span>
        </label>
    </div>

    <!-- 油種 Tabs -->
    <div class="tabs">
        <button class="tab-btn active" id="tab-standard" onclick="switchTab('standard')">無鉛汽油</button>
        <button class="tab-btn" id="tab-premium" onclick="switchTab('premium')">特級(靚油)</button>
        <button class="tab-btn" id="tab-diesel" onclick="switchTab('diesel')">環保柴油</button>
    </div>

    <!-- 油站列表 -->
    <div class="price-list" id="priceList">
        <!-- JS 動態生成區塊 -->
    </div>

    <div class="disclaimer">
        * 註解：本程式數據基於香港市場最新基準指標。當開啟車隊卡功能後，Esso 牌價將自動套用你的私家卡折扣 (-$10/-$11) 覆蓋原有門市折扣。其他油站因日子推廣折後可能更平，一切以現場標示為準。
    </div>
</div>

<script>
    // 香港各大油站基準油價與門市常規折扣數據庫
    const petrolData = {
        standard: [
            { id: 'petrochina', name: '中國石油 (PetroChina)', base: 24.59, discount: 7.00, color: '#FF5722' },
            { id: 'shell', name: '蜆殼 (Shell)', base: 24.59, discount: 7.00, color: '#FFEB3B' },
            { id: 'sinopec', name: '中石化 (Sinopec)', base: 24.59, discount: 6.00, color: '#E53935' },
            { id: 'esso', name: '埃索 (Esso)', base: 24.59, discount: 1.60, color: '#1E88E5' },
            { id: 'caltex', name: '加德士 (Caltex)', base: 24.59, discount: 0.90, color: '#00897B' }
        ],
        premium: [
            { id: 'petrochina', name: '中國石油 (PetroChina)', base: 25.78, discount: 14.00, color: '#FF5722' },
            { id: 'sinopec', name: '中石化 (Sinopec)', base: 25.78, discount: 13.99, color: '#E53935' },
            { id: 'shell', name: '蜆殼 (Shell)', base: 25.78, discount: 7.00, color: '#FFEB3B' },
            { id: 'esso', name: '埃索 (Esso)', base: 25.78, discount: 1.60, color: '#1E88E5' },
            { id: 'caltex', name: '加德士 (Caltex)', base: 25.78, discount: 0.90, color: '#00897B' }
        ],
        diesel: [
            { id: 'petrochina', name: '中國石油 (PetroChina)', base: 23.35, discount: 8.00, color: '#FF5722' },
            { id: 'sinopec', name: '中石化 (Sinopec)', base: 23.35, discount: 7.00, color: '#E53935' },
            { id: 'shell', name: '蜆殼 (Shell)', base: 23.35, discount: 6.00, color: '#FFEB3B' },
            { id: 'esso', name: '埃索 (Esso)', base: 23.35, discount: 1.60, color: '#1E88E5' },
            { id: 'caltex', name: '加德士 (Caltex)', base: 23.35, discount: 0.90, color: '#00897B' }
        ]
    };

    // 使用者的專屬 Esso 車隊卡折扣
    const fleetCardDiscount = {
        standard: 10.00, // Extra
        premium: 11.00,  // Supreme+
        diesel: 0.00     // 假設柴油無提供車隊卡，如有需要可改
    };

    let currentTab = 'standard';
    let isLoading = false;

    // 模擬同步 API 數據
    async function fetchData() {
        if (isLoading) return;
        isLoading = true;
        
        const btn = document.getElementById('refreshBtn');
        btn.innerText = '⏳ 同步中...';
        btn.style.opacity = 0.7;

        setTimeout(() => {
            renderList(currentTab);
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
            
            document.getElementById('updateTime').innerText = `最後同步: 今日 ${timeStr}`;
            btn.innerText = '🔄 立即同步';
            btn.style.opacity = 1;
            isLoading = false;
        }, 600);
    }

    function switchTab(type) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + type).classList.add('active');
        renderList(type);
    }

    function renderList(type) {
        currentTab = type;
        const listEl = document.getElementById('priceList');
        const isFleetCardOn = document.getElementById('fleetToggle').checked;
        listEl.innerHTML = '';
        
        // 運算並覆寫折扣
        let data = petrolData[type].map(item => {
            let activeDiscount = item.discount;
            let isFleetApplied = false;

            // 若開啟車隊卡，且當前油站係 Esso，則套用專屬車隊折扣取代門市折扣
            if (isFleetCardOn && item.id === 'esso' && fleetCardDiscount[type] > 0) {
                activeDiscount = fleetCardDiscount[type];
                isFleetApplied = true;
            }

            return {
                ...item,
                activeDiscount: activeDiscount,
                finalPrice: item.base - activeDiscount,
                isFleetApplied: isFleetApplied
            };
        }).sort((a, b) => a.finalPrice - b.finalPrice); // 由平到貴大洗牌排序
        
        // 找出全場最平嘅價錢 (用黎頒皇冠)
        const minPrice = data[0].finalPrice;

        data.forEach((item, index) => {
            // 如果最終價格等於最平嘅價格，就封佢做第一名 (可能有多個並列)
            const isFirst = item.finalPrice === minPrice;
            const rankIcon = isFirst ? '👑' : (index + 1);
            const rankClass = isFirst ? 'rank first' : 'rank';
            
            // 標示狀態：套用緊專屬油卡定係門市優惠
            let badgeHtml = '';
            if (item.isFleetApplied) {
                badgeHtml = `<span class="badge fleet">💳 車隊卡優惠</span>`;
            } else if (item.activeDiscount > 8) { 
                // 純粹標示大折扣，例如中石油特級減 $14
                badgeHtml = `<span class="badge">🔥 門市暴走劈價</span>`;
            }

            const card = document.createElement('div');
            card.className = 'card';
            card.style.setProperty('--station-color', item.color);
            card.style.animationDelay = `${index * 0.1}s`;
            
            card.innerHTML = `
                <div class="${rankClass}">${rankIcon}</div>
                <div class="station-info">
                    <div class="station-name">
                        ${item.name} ${badgeHtml}
                    </div>
                    <div class="price-breakdown">
                        牌價: <span class="strike-price">$${item.base.toFixed(2)}</span> | 
                        折扣: <span class="discount-amt">-$${item.activeDiscount.toFixed(2)}</span>
                    </div>
                </div>
                <div class="final-price-box">
                    <div class="final-price">$${item.finalPrice.toFixed(2)}</div>
                    <div class="unit">/公升</div>
                </div>
            `;
            listEl.appendChild(card);
        });
    }

    // 初次載入自動同步
    fetchData();
</script>

</body>
</html>
