<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⛽ 香港每日油價通</title>
    <style>
        :root {
            /* 柔和莫蘭迪配色 */
            --bg-dark: #1E232E;       
            --bg-card: #2A3143;       
            --primary: #82A0D8;       
            --primary-glow: rgba(130, 160, 216, 0.25);
            --text-main: #E2E8F0;     
            --text-muted: #94A3B8;    
            --success: #5D8A66;
            --gold: #FBBF24;
            --badge-bg: rgba(251, 191, 36, 0.2);
            --esso-blue: #1E88E5;
            --shell-yellow: #FFEB3B;
            --shell-red: #D32F2F;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 4px;
        }
        .header h2 {
            color: var(--primary);
            font-size: 22px;
            margin: 0 0 6px 0;
            letter-spacing: 0.5px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
        }

        /* 狀態列 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .update-time {
            font-size: 12px;
            color: var(--text-muted);
        }
        .refresh-btn {
            background: rgba(130, 160, 216, 0.15);
            color: var(--primary);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .refresh-btn:active { transform: scale(0.95); }

        /* 車隊卡控制面板 */
        .fleet-panel {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }
        .fleet-card-box {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .fleet-card-box:last-child { border-bottom: none; }
        
        .fleet-card-box.esso {
            background: linear-gradient(90deg, rgba(30, 136, 229, 0.1) 0%, transparent 100%);
            border-left: 3px solid var(--esso-blue);
        }
        .fleet-card-box.shell {
            background: linear-gradient(90deg, rgba(255, 235, 59, 0.1) 0%, transparent 100%);
            border-left: 3px solid var(--shell-yellow);
        }

        .fleet-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .fleet-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
        }
        .fleet-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.1);
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider.esso-slider { background-color: var(--esso-blue); }
        input:checked + .slider.shell-slider { background-color: var(--shell-yellow); }
        input:checked + .slider.shell-slider:before { background-color: var(--shell-red); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* 分類 Tabs */
        .tabs {
            display: flex;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #111827;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        /* 油站列表 */
        .price-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 5px solid var(--station-color, var(--primary));
            animation: slideIn 0.3s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .station-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }
        
        .station-name-row {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px;
        }
        .station-name {
            font-weight: bold;
            font-size: 16px;
            color: var(--text-main);
        }
        .fuel-name {
            font-size: 13px;
            color: var(--primary);
            font-style: italic;
        }

        .badge-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--gold);
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge.fleet-esso {
            background: rgba(30, 136, 229, 0.2);
            color: #60A5FA;
        }
        .badge.fleet-shell {
            background: rgba(255, 235, 59, 0.15);
            color: #FDE047;
            border: 1px solid rgba(255, 235, 59, 0.3);
        }
        .badge.upgrade {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .price-breakdown {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
        }

        .final-price-box {
            text-align: right;
            min-width: 90px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
        }
        .price-label {
            font-size: 11px;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }
        .final-price {
            font-size: 26px;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>⛽ 香港每日油價通</h2>
        <p>實時比較各大門市與多張車隊卡折後價</p>
    </div>

    <!-- 狀態列 -->
    <div class="status-bar">
        <span class="update-time" id="updateTime">最後更新: 載入中...</span>
        <button class="refresh-btn" id="refreshBtn" onclick="fetchData()">🔄 立即同步</button>
    </div>

    <!-- 車隊卡控制面板 -->
    <div class="fleet-panel">
        <!-- Esso 卡 -->
        <div class="fleet-card-box esso">
            <div class="fleet-info">
                <div class="fleet-title">💳 啟用 Esso 車隊卡</div>
                <div class="fleet-desc">Extra 減 $10 | Supreme+ 減 $11 (連免費升級)</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="essoToggle" onchange="renderList(currentTab)" checked>
                <span class="slider esso-slider"></span>
            </label>
        </div>
        <!-- Shell 卡 -->
        <div class="fleet-card-box shell">
            <div class="fleet-info">
                <div class="fleet-title">💳 啟用 Shell 車隊卡</div>
                <div class="fleet-desc">全線汽油每升即減 $10.7</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="shellToggle" onchange="renderList(currentTab)" checked>
                <span class="slider shell-slider"></span>
            </label>
        </div>
    </div>

    <!-- 油種 Tabs -->
    <div class="tabs">
        <button class="tab-btn active" id="tab-standard" onclick="switchTab('standard')">無鉛汽油</button>
        <button class="tab-btn" id="tab-premium" onclick="switchTab('premium')">特級無鉛汽油</button>
    </div>

    <!-- 油站列表 -->
    <div class="price-list" id="priceList">
        <!-- JS 動態生成區塊 -->
    </div>
</div>

<script>
    // 官方基準油價與專屬油品名稱
    const petrolData = {
        standard: [
            { id: 'petrochina', name: '中國石油', fuelName: '清新汽油', base: 34.62, discount: 7.00, color: '#FF5722' },
            { id: 'sinopec', name: '中石化', fuelName: '中石化汽油', base: 34.62, discount: 6.00, color: '#E53935' },
            { id: 'shell', name: '蜆殼', fuelName: 'Shell FuelSave', base: 34.62, discount: 5.00, color: '#FFEB3B' },
            { id: 'esso', name: '埃索', fuelName: 'Synergy Extra', base: 34.62, discount: 1.60, color: '#1E88E5' },
            { id: 'caltex', name: '加德士', fuelName: 'Techron 黃金汽油', base: 34.62, discount: 0.90, color: '#00897B' }
        ],
        premium: [
            { id: 'sinopec', name: '中石化', fuelName: 'Sino X Power', base: 36.42, discount: 7.80, color: '#E53935' },
            { id: 'petrochina', name: '中國石油', fuelName: '超級清新汽油', base: 36.42, discount: 7.00, color: '#FF5722' },
            { id: 'shell', name: '蜆殼', fuelName: 'Shell V-Power', base: 36.42, discount: 5.00, color: '#FFEB3B' },
            { id: 'esso', name: '埃索', fuelName: 'Synergy Supreme+', base: 36.42, discount: 1.60, color: '#1E88E5' },
            { id: 'caltex', name: '加德士', fuelName: 'Techron 白金汽油', base: 36.42, discount: 0.90, color: '#00897B' }
        ]
    };

    // 車隊卡專屬折扣額
    const fleetCardDiscount = {
        esso: { standard: 10.00, premium: 11.00 },
        shell: { standard: 10.70, premium: 10.70 } // 根據圖片顯示，全部汽油減 $10.7
    };

    let currentTab = 'standard';
    let isLoading = false;

    async function fetchData() {
        if (isLoading) return;
        isLoading = true;
        
        const btn = document.getElementById('refreshBtn');
        btn.innerText = '⏳ 同步中...';
        btn.style.opacity = 0.7;

        setTimeout(() => {
            renderList(currentTab);
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('updateTime').innerText = `最後同步: 今日 ${timeStr}`;
            btn.innerText = '🔄 立即同步';
            btn.style.opacity = 1;
            isLoading = false;
        }, 500);
    }

    function switchTab(type) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + type).classList.add('active');
        renderList(type);
    }

    function renderList(type) {
        currentTab = type;
        const listEl = document.getElementById('priceList');
        const isEssoOn = document.getElementById('essoToggle').checked;
        const isShellOn = document.getElementById('shellToggle').checked;
        listEl.innerHTML = '';
        
        // 運算最終折後價
        let data = petrolData[type].map(item => {
            let activeBase = item.base;
            let activeDiscount = item.discount;
            let fleetApplied = null; // 'esso' 或 'shell'
            let isFreeUpgrade = false;

            // 處理 Esso 車隊卡邏輯
            if (isEssoOn && item.id === 'esso') {
                activeDiscount = fleetCardDiscount.esso[type];
                fleetApplied = 'esso';
                
                // 特級汽油免費升級邏輯
                if (type === 'premium') {
                    const standardEssoBase = petrolData.standard.find(p => p.id === 'esso').base;
                    activeBase = standardEssoBase; 
                    isFreeUpgrade = true;
                }
            }

            // 處理 Shell 車隊卡邏輯
            if (isShellOn && item.id === 'shell') {
                activeDiscount = fleetCardDiscount.shell[type];
                fleetApplied = 'shell';
                // 註：圖片中未提及 Shell 特級有免費升級，故按原牌價計算
            }

            return {
                ...item,
                activeBase: activeBase,
                activeDiscount: activeDiscount,
                finalPrice: activeBase - activeDiscount,
                fleetApplied: fleetApplied,
                isFreeUpgrade: isFreeUpgrade
            };
        }).sort((a, b) => a.finalPrice - b.finalPrice); // 由平到貴排序
        
        const minPrice = data[0].finalPrice;

        data.forEach((item, index) => {
            const isFirst = item.finalPrice === minPrice;
            
            // 處理各種徽章 (Badges)
            let badges = [];
            if (isFirst) badges.push(`<span class="badge">👑 全場最平</span>`);
            
            if (item.fleetApplied === 'esso') {
                badges.push(`<span class="badge fleet-esso">💳 Esso卡優惠</span>`);
            } else if (item.fleetApplied === 'shell') {
                badges.push(`<span class="badge fleet-shell">💳 Shell卡優惠</span>`);
            }
            
            if (item.isFreeUpgrade) badges.push(`<span class="badge upgrade">🚀 免費升級牌價計法</span>`);
            
            const badgeHtml = badges.length > 0 ? `<div class="badge-row">${badges.join('')}</div>` : '';

            const card = document.createElement('div');
            card.className = 'card';
            card.style.setProperty('--station-color', item.color);
            card.style.animationDelay = `${index * 0.1}s`;
            
            card.innerHTML = `
                <div class="station-info">
                    <div class="station-name-row">
                        <span class="station-name">${item.name}</span>
                        <span class="fuel-name">${item.fuelName}</span>
                    </div>
                    ${badgeHtml}
                    <div class="price-breakdown">
                        <span>牌價: $${item.activeBase.toFixed(2)}</span>
                        <span>(扣減: -$${item.activeDiscount.toFixed(2)})</span>
                    </div>
                </div>
                <div class="final-price-box">
                    <div class="price-label">折後價</div>
                    <div class="final-price">$${item.finalPrice.toFixed(2)}</div>
                </div>
            `;
            listEl.appendChild(card);
        });
    }

    // 初始化載入
    fetchData();
</script>

</body>
</html>
