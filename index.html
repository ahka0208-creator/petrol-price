<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⛽ 香港每日油價通</title>
    <style>
        :root {
            /* 柔和莫蘭迪配色 */
            --bg-dark: #1E232E;       
            --bg-card: #2A3143;       
            --primary: #82A0D8;       
            --primary-glow: rgba(130, 160, 216, 0.25);
            --text-main: #E2E8F0;     
            --text-muted: #94A3B8;    
            --success: #5D8A66;
            --gold: #FBBF24;
            --badge-bg: rgba(251, 191, 36, 0.2);
            --esso-blue: #1E88E5;
            --shell-yellow: #FFEB3B;
            --shell-red: #D32F2F;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 180px; /* 預留空間俾置底計算機 */
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 4px;
        }
        .header h2 {
            color: var(--primary);
            font-size: 22px;
            margin: 0 0 6px 0;
            letter-spacing: 0.5px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
        }

        /* 狀態列 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .update-time {
            font-size: 12px;
            color: var(--text-muted);
        }
        .refresh-btn {
            background: rgba(130, 160, 216, 0.15);
            color: var(--primary);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .refresh-btn:active { transform: scale(0.95); }

        /* 車隊卡控制面板 */
        .fleet-panel {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }
        .fleet-card-box {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .fleet-card-box:last-child { border-bottom: none; }
        
        .fleet-card-box.esso {
            background: linear-gradient(90deg, rgba(30, 136, 229, 0.1) 0%, transparent 100%);
            border-left: 3px solid var(--esso-blue);
        }
        .fleet-card-box.shell {
            background: linear-gradient(90deg, rgba(255, 235, 59, 0.1) 0%, transparent 100%);
            border-left: 3px solid var(--shell-yellow);
        }

        .fleet-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .fleet-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
        }
        .fleet-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.1);
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider.esso-slider { background-color: var(--esso-blue); }
        input:checked + .slider.shell-slider { background-color: var(--shell-yellow); }
        input:checked + .slider.shell-slider:before { background-color: var(--shell-red); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* 分類 Tabs */
        .tabs {
            display: flex;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #111827;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        /* 油站列表 */
        .price-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 5px solid var(--station-color, var(--primary));
            animation: slideIn 0.3s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .station-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }
        
        .station-name-row {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px;
        }
        .station-name {
            font-weight: bold;
            font-size: 16px;
            color: var(--text-main);
        }
        .fuel-name {
            font-size: 13px;
            color: var(--primary);
            font-style: italic;
        }

        .badge-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--gold);
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge.fleet-esso {
            background: rgba(30, 136, 229, 0.2);
            color: #60A5FA;
        }
        .badge.fleet-shell {
            background: rgba(255, 235, 59, 0.15);
            color: #FDE047;
            border: 1px solid rgba(255, 235, 59, 0.3);
        }
        .badge.upgrade {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .price-breakdown {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
        }

        .final-price-box {
            text-align: right;
            min-width: 90px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
        }
        .price-label {
            font-size: 11px;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }
        .final-price {
            font-size: 26px;
            font-weight: bold;
            color: #fff;
        }

        /* 實時計算機 (懸浮置底) */
        .calculator-card {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 420px;
            background: linear-gradient(145deg, #2A3143 0%, #1E232E 100%);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(130, 160, 216, 0.3);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }

        .calc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .calc-header h3 {
            margin: 0;
            font-size: 15px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .calc-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        select.calc-select {
            flex: 1;
            background: rgba(0,0,0,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        
        input.calc-input {
            width: 80px;
            background: rgba(0,0,0,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            text-align: center;
        }

        .quick-btns {
            display: flex;
            gap: 8px;
        }
        .quick-btns button {
            flex: 1;
            background: rgba(130, 160, 216, 0.15);
            color: var(--text-main);
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .quick-btns button:active { background: var(--primary); color: #000; }

        .calc-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255,255,255,0.1);
        }
        .calc-result span {
            font-size: 13px;
            color: var(--text-muted);
        }
        .calc-result strong {
            font-size: 22px;
            color: var(--gold);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>⛽ 香港每日油價通</h2>
        <p>實時比較各大門市與多張車隊卡折後價</p>
    </div>

    <div class="status-bar">
        <span class="update-time" id="updateTime">最後更新: 載入中...</span>
        <button class="refresh-btn" id="refreshBtn" onclick="fetchData()">🔄 立即同步</button>
    </div>

    <div class="fleet-panel">
        <div class="fleet-card-box esso">
            <div class="fleet-info">
                <div class="fleet-title">💳 啟用 Esso 車隊卡</div>
                <div class="fleet-desc">Extra 減 $10 | Supreme+ 減 $11 (連免費升級)</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="essoToggle" onchange="renderList(currentTab)" checked>
                <span class="slider esso-slider"></span>
            </label>
        </div>
        <div class="fleet-card-box shell">
            <div class="fleet-info">
                <div class="fleet-title">💳 啟用 Shell 車隊卡</div>
                <div class="fleet-desc">全線汽油每升即減 $10.7</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="shellToggle" onchange="renderList(currentTab)" checked>
                <span class="slider shell-slider"></span>
            </label>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-standard" onclick="switchTab('standard')">無鉛汽油</button>
        <button class="tab-btn" id="tab-premium" onclick="switchTab('premium')">特級無鉛汽油</button>
    </div>

    <div class="price-list" id="priceList">
        <!-- JS 動態生成區塊 -->
    </div>
</div>

<!-- 懸浮置底計算機 -->
<div class="calculator-card">
    <div class="calc-header">
        <h3>🧮 實時入油預算</h3>
    </div>
    <div class="calc-controls">
        <select class="calc-select" id="calcStation" onchange="calculateTotal()"></select>
        <input type="number" class="calc-input" id="calcLiters" placeholder="升數(L)" oninput="calculateTotal()">
    </div>
    <div class="quick-btns">
        <button onclick="setLiters(5)">+ 5L</button>
        <button onclick="setLiters(10)">+ 10L</button>
        <button onclick="setLiters(11.2)" style="border: 1px solid var(--primary); color: var(--primary);">CMX500 入滿 (11.2L)</button>
    </div>
    <div class="calc-result">
        <span>預計總開支：</span>
        <strong id="calcTotal">$0.00</strong>
    </div>
</div>

<script>
    // 官方基準油價與專屬油品名稱
    const petrolData = {
        standard: [
            { id: 'petrochina', name: '中國石油', fuelName: '清新汽油', base: 34.62, discount: 7.00, color: '#FF5722' },
            { id: 'sinopec', name: '中石化', fuelName: '中石化汽油', base: 34.62, discount: 6.00, color: '#E53935' },
            { id: 'shell', name: '蜆殼', fuelName: 'Shell FuelSave', base: 34.62, discount: 5.00, color: '#FFEB3B' },
            { id: 'esso', name: '埃索', fuelName: 'Synergy Extra', base: 34.62, discount: 1.60, color: '#1E88E5' },
            { id: 'caltex', name: '加德士', fuelName: 'Techron 黃金汽油', base: 34.62, discount: 0.90, color: '#00897B' }
        ],
        premium: [
            { id: 'sinopec', name: '中石化', fuelName: 'Sino X Power', base: 36.42, discount: 7.80, color: '#E53935' },
            { id: 'petrochina', name: '中國石油', fuelName: '超級清新汽油', base: 36.42, discount: 7.00, color: '#FF5722' },
            { id: 'shell', name: '蜆殼', fuelName: 'Shell V-Power', base: 36.42, discount: 5.00, color: '#FFEB3B' },
            { id: 'esso', name: '埃索', fuelName: 'Synergy Supreme+', base: 36.42, discount: 1.60, color: '#1E88E5' },
            { id: 'caltex', name: '加德士', fuelName: 'Techron 白金汽油', base: 36.42, discount: 0.90, color: '#00897B' }
        ]
    };

    const fleetCardDiscount = {
        esso: { standard: 10.00, premium: 11.00 },
        shell: { standard: 10.70, premium: 10.70 } 
    };

    let currentTab = 'standard';
    let isLoading = false;
    let currentSortedData = []; // 用於計算機數據聯動

    async function fetchData() {
        if (isLoading) return;
        isLoading = true;
        
        const btn = document.getElementById('refreshBtn');
        btn.innerText = '⏳ 同步中...';
        btn.style.opacity = 0.7;

        setTimeout(() => {
            renderList(currentTab);
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('updateTime').innerText = `最後同步: 今日 ${timeStr}`;
            btn.innerText = '🔄 立即同步';
            btn.style.opacity = 1;
            isLoading = false;
        }, 500);
    }

    function switchTab(type) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + type).classList.add('active');
        renderList(type);
    }

    function renderList(type) {
        currentTab = type;
        const listEl = document.getElementById('priceList');
        const isEssoOn = document.getElementById('essoToggle').checked;
        const isShellOn = document.getElementById('shellToggle').checked;
        listEl.innerHTML = '';
        
        // 運算最終折後價
        let data = petrolData[type].map(item => {
            let activeBase = item.base;
            let activeDiscount = item.discount;
            let fleetApplied = null;
            let isFreeUpgrade = false;

            if (isEssoOn && item.id === 'esso') {
                activeDiscount = fleetCardDiscount.esso[type];
                fleetApplied = 'esso';
                if (type === 'premium') {
                    const standardEssoBase = petrolData.standard.find(p => p.id === 'esso').base;
                    activeBase = standardEssoBase; 
                    isFreeUpgrade = true;
                }
            }

            if (isShellOn && item.id === 'shell') {
                activeDiscount = fleetCardDiscount.shell[type];
                fleetApplied = 'shell';
            }

            return {
                ...item,
                activeBase: activeBase,
                activeDiscount: activeDiscount,
                finalPrice: activeBase - activeDiscount,
                fleetApplied: fleetApplied,
                isFreeUpgrade: isFreeUpgrade
            };
        }).sort((a, b) => a.finalPrice - b.finalPrice); 
        
        currentSortedData = data; // 更新全域數據供計算機使用
        const minPrice = data[0].finalPrice;

        data.forEach((item, index) => {
            const isFirst = item.finalPrice === minPrice;
            let badges = [];
            if (isFirst) badges.push(`<span class="badge">👑 全場最平</span>`);
            if (item.fleetApplied === 'esso') badges.push(`<span class="badge fleet-esso">💳 Esso卡</span>`);
            else if (item.fleetApplied === 'shell') badges.push(`<span class="badge fleet-shell">💳 Shell卡</span>`);
            if (item.isFreeUpgrade) badges.push(`<span class="badge upgrade">🚀 免費升級牌價</span>`);
            
            const badgeHtml = badges.length > 0 ? `<div class="badge-row">${badges.join('')}</div>` : '';

            const card = document.createElement('div');
            card.className = 'card';
            card.style.setProperty('--station-color', item.color);
            card.style.animationDelay = `${index * 0.1}s`;
            
            card.innerHTML = `
                <div class="station-info">
                    <div class="station-name-row">
                        <span class="station-name">${item.name}</span>
                        <span class="fuel-name">${item.fuelName}</span>
                    </div>
                    ${badgeHtml}
                    <div class="price-breakdown">
                        <span>牌價: $${item.activeBase.toFixed(2)}</span>
                        <span>(扣減: -$${item.activeDiscount.toFixed(2)})</span>
                    </div>
                </div>
                <div class="final-price-box">
                    <div class="price-label">折後價</div>
                    <div class="final-price">$${item.finalPrice.toFixed(2)}</div>
                </div>
            `;
            listEl.appendChild(card);
        });

        updateCalculatorOptions();
    }

    /* === 計算機相關邏輯 === */
    function updateCalculatorOptions() {
        const select = document.getElementById('calcStation');
        select.innerHTML = '';
        currentSortedData.forEach((item, index) => {
            const option = document.createElement('option');
            option.value = item.finalPrice;
            // 第一名加上皇冠標記
            const prefix = index === 0 ? '👑 ' : '';
            option.innerText = `${prefix}${item.name} ($${item.finalPrice.toFixed(2)}/L)`;
            select.appendChild(option);
        });
        calculateTotal(); // 更新列表後重新計算
    }

    function setLiters(val) {
        const input = document.getElementById('calcLiters');
        input.value = val;
        calculateTotal();
    }

    function calculateTotal() {
        const pricePerLiter = parseFloat(document.getElementById('calcStation').value) || 0;
        const liters = parseFloat(document.getElementById('calcLiters').value) || 0;
        const total = pricePerLiter * liters;
        
        document.getElementById('calcTotal').innerText = `$${total.toFixed(2)}`;
    }

    // 初始化載入
    fetchData();
</script>

</body>
</html>
